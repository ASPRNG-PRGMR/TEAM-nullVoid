; Binary Bin - ESP32-S3-CAM (N16R8) firmware
; Board: ESP32-S3 WROOM-1 N16R8  =  16 MB QIO flash + 8 MB OPI PSRAM, with an
; OV2640/OV5640 camera module and an onboard flash LED.
;
;   pio run -e s3cam -t upload        # Wi-Fi link (default)
;   pio run -e s3cam_uart -t upload   # USB-UART link
;   pio run -e s3cam_probe -t upload  # find the right camera pin map
;   pio device monitor

[platformio]
default_envs = s3cam

[common]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
; N16R8: QIO flash + OPI PSRAM. Change to qio_qspi for an N16R2/N8R2 part.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
lib_deps =
	madhephaestus/ESP32Servo@^3.0.5
	bblanchon/ArduinoJson@^7.1.0
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=3
	-std=gnu++17
build_unflags = -std=gnu++11

; --- Wi-Fi link, native USB-CDC console -------------------------------------
[env:s3cam]
extends = common
build_flags =
	${common.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBB_BOARD_PROFILE=BB_BOARD_GENERIC_S3CAM
	-DBB_LINK_DEFAULT=BB_LINK_WIFI

; --- USB-UART link (framed binary over the same port as the console) --------
; Set ARDUINO_USB_CDC_ON_BOOT=0 if your board talks through a CP2102/CH343
; bridge on UART0 instead of the ESP32-S3's native USB port.
[env:s3cam_uart]
extends = common
build_flags =
	${common.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBB_BOARD_PROFILE=BB_BOARD_GENERIC_S3CAM
	-DBB_LINK_DEFAULT=BB_LINK_UART

; --- One-shot: identify which camera pin map this board actually uses -------
[env:s3cam_probe]
extends = common
build_flags =
	${common.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBB_BOARD_PROFILE=BB_BOARD_GENERIC_S3CAM
	-DBB_LINK_DEFAULT=BB_LINK_UART
	-DBB_RUN_PIN_PROBE=1
